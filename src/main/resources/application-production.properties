# Production Profile Configuration
# Activate this profile by setting: spring.profiles.active=production
# Or via environment variable: SPRING_PROFILES_ACTIVE=production
# Or via command line: --spring.profiles.active=production

# PostgreSQL Database Configuration
# IMPORTANT: Override these values using environment variables in production
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# Connection Pool Configuration (HikariCP - default in Spring Boot)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA/Hibernate Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# IMPORTANT: Use 'validate' in production after initial setup
# For first deployment, use 'update' to create tables, then switch to 'validate'
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Schema migrations (src/main/resources/db/migration), applied on startup.
#
# This is what keeps ddl-auto=validate honest: the jar that needs a column is the jar that adds
# it, so there is no longer a window where a new backend meets an old schema and restart-loops.
# A migration that fails aborts startup on purpose - a half-migrated database serving traffic is
# worse than a deploy that visibly refuses to come up.
spring.flyway.enabled=true
# The database predates Flyway: schema.sql built it and V1/V2 were applied by hand. Baselining at
# 2 stamps that history instead of replaying it, so only V3 and up ever run here. This also covers
# a fresh volume, where docker-entrypoint-initdb.d runs schema.sql first and Flyway then finds a
# populated database rather than an empty one.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# Disable H2 Console (security)
spring.h2.console.enabled=false

# Production Logging Configuration
logging.level.com.budgethunter=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
logging.file.name=logs/budgethunter.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=1GB
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# JWT Configuration
# IMPORTANT: Override jwt.secret with a secure random value in production
jwt.secret=${JWT_SECRET:budgethunter-production-secret-key-CHANGE-THIS-IN-PRODUCTION-minimum-256-bits-required}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Automatic entry categorization (Gemini). With no key it stays idle and nothing leaves the server.
# Only the normalised description text is sent. The free tier may use submitted data to improve
# Google's products, so use a paid key if that matters.
categorization.enabled=${CATEGORIZATION_ENABLED:true}
categorization.gemini.api-key=${GEMINI_API_KEY:}
categorization.gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
categorization.gemini.max-requests-per-minute=${GEMINI_MAX_REQUESTS_PER_MINUTE:10}

# Production Server Configuration
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Rate Limiting (enabled in production profile - see RateLimitConfig.kt)
# Default: 100 requests per minute per IP
# Configure in RateLimitConfig.kt if customization is needed

# Actuator Configuration (Production)
# Only expose health endpoint for monitoring
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized
# Health check groups for container orchestration (Kubernetes, Docker)
management.endpoint.health.group.liveness.include=ping
management.endpoint.health.group.readiness.include=db

# ============================================
# GOOGLE SIGN-IN
# ============================================
# Every OAuth client id that may issue an ID token for this app, comma separated.
# Android tokens carry the *web* client id in "aud" (passed as serverClientId); iOS tokens carry
# the *iOS* client id, so both have to be listed once iOS ships.
google.auth.client-ids=${GOOGLE_OAUTH_CLIENT_IDS:}
