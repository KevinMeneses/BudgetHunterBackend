# Test Configuration
#
# WARNING: this file SHADOWS src/main/resources/application.properties - same name on
# the classpath, and test resources win, so the main one is never loaded. Anything set
# there and needed here has to be repeated below, or the tests silently run against a
# different configuration than production.
#
# Why it exists: the main file activates the `production` profile, which points
# Hibernate at PostgreSQL with ddl-auto=validate. Tests must never depend on an external
# database, so the test runtime is pinned to `debug`: H2 in-memory, ddl-auto=update,
# rate limiting disabled.
spring.profiles.active=debug

spring.application.name=budgethunter-backend

# Mirrored from src/main/resources/application.properties.
# Disable Open Session In View to prevent transaction leaks in streaming endpoints.
# This one matters for the SSE tests specifically: with OSIV enabled the session stays
# open for the life of the request, which for a stream is unbounded - exactly what the
# production setting exists to prevent. Tests must exercise the production behaviour.
spring.jpa.open-in-view=false
