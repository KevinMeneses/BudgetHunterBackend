version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The three Kotlin compiler plugins have to move together. Dependabot names them after the
      # short string in the `kotlin("...")` DSL, not their maven coordinates, so a pattern like
      # "org.jetbrains.kotlin*" never matched them and each arrived on its own. That is how PR #6
      # came to propose plugin.spring 2.4.20 alongside jvm 2.0.20, which stopped the build script
      # from compiling at all.
      kotlin-plugins:
        patterns:
          - "jvm"
          - "plugin.spring"
          - "plugin.jpa"
          - "org.jetbrains.kotlin"
          - "org.jetbrains.kotlin.*"
      spring:
        patterns:
          - "org.springframework*"
          - "io.spring*"
      # Kover used to fall into the Spring group through "org.jetbrains.kotlinx*", so a coverage
      # bump could ride along with a framework upgrade. The build's quality tooling is its own
      # concern and reviewing it together makes the diff readable.
      quality-tools:
        patterns:
          - "org.jlleitschuh.gradle.ktlint"
          - "io.gitlab.arturbosch.detekt"
          - "org.jetbrains.kotlinx.kover"
      test:
        patterns:
          - "io.mockk*"
          - "io.projectreactor*"
          - "org.jetbrains.kotlinx.coroutines-test"
    ignore:
      # Majors of these are migrations, not updates, and a weekly PR is the wrong way to meet one.
      # Spring Boot 4.1.1 turned up grouped with a Kover bump and needed Gradle 8.14+, Spring
      # Framework 7 and Security 7. A Kotlin major drags the three compiler plugins, detekt's
      # Kotlin pin and the removed kotlinOptions DSL along with it. Both are worth doing
      # deliberately, in a PR of their own, from the release notes.
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.spring.dependency-management"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework*"
        update-types: ["version-update:semver-major"]
      # Kotlin needs minors held back as well as majors, which PR #6 (2.0.20 -> 2.4.20) showed
      # costs three separate pieces of work, none of them a version bump:
      #   - `Smart cast to 'Long' is impossible` in BudgetService becomes an error, because the
      #     JPA plugin makes entities open and Budget.id is a nullable Long
      #   - Kover 0.8.3 reaches for a `compileKotlinTask` property the new plugin no longer has
      #   - ktlint's engine 1.3.1 cannot read the 2.4 compiler ('KtTokens ... HEADER_KEYWORD'),
      #     so it has to move too, bringing whatever its newer rules decide about this code
      # Patches (2.0.21 and such) still come through, which is what a detekt pin bump needs.
      - dependency-name: "jvm"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "plugin.spring"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "plugin.jpa"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # springdoc 3.x follows Spring Boot 4, so it is unreachable until that migration happens:
      # its starter depends on spring-boot-validation and spring-boot-jackson, modules that only
      # exist in Boot 4, and it ships Kotlin 2.3 metadata this project cannot read - "The binary
      # version of its metadata is 2.3.0, expected version is 2.0.0" is how PR #18 failed.
      # 2.8.17 is the head of the 2.x line, so holding majors back costs no updates at all.
      - dependency-name: "org.springdoc*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
